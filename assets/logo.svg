<svg width="860" height="260" viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="860" height="260" fill="#0d1117"/>

  <!-- shield mark -->
  <path d="M120,30 L180,52 V112 C180,156 154,190 120,208 C86,190 60,156 60,112 V52 Z"
        fill="#11161d" stroke="url(#shieldStroke)" stroke-width="4" stroke-linejoin="round"/>

  <!-- neural network inside shield (LLM) -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.35">
    <!-- layer 1 to layer 2 -->
    <line x1="90" y1="95" x2="120" y2="85"/>
    <line x1="90" y1="95" x2="120" y2="110"/>
    <line x1="90" y1="95" x2="120" y2="135"/>
    <line x1="90" y1="95" x2="120" y2="160"/>
    <line x1="90" y1="125" x2="120" y2="85"/>
    <line x1="90" y1="125" x2="120" y2="110"/>
    <line x1="90" y1="125" x2="120" y2="135"/>
    <line x1="90" y1="125" x2="120" y2="160"/>
    <line x1="90" y1="155" x2="120" y2="85"/>
    <line x1="90" y1="155" x2="120" y2="110"/>
    <line x1="90" y1="155" x2="120" y2="135"/>
    <line x1="90" y1="155" x2="120" y2="160"/>
    <!-- layer 2 to layer 3 -->
    <line x1="120" y1="85" x2="150" y2="105"/>
    <line x1="120" y1="85" x2="150" y2="145"/>
    <line x1="120" y1="110" x2="150" y2="105"/>
    <line x1="120" y1="110" x2="150" y2="145"/>
    <line x1="120" y1="135" x2="150" y2="105"/>
    <line x1="120" y1="135" x2="150" y2="145"/>
    <line x1="120" y1="160" x2="150" y2="105"/>
    <line x1="120" y1="160" x2="150" y2="145"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="90" cy="95" r="4.5"/>
    <circle cx="90" cy="125" r="4.5"/>
    <circle cx="90" cy="155" r="4.5"/>
    <circle cx="120" cy="85" r="4.5"/>
    <circle cx="120" cy="110" r="4.5"/>
    <circle cx="120" cy="135" r="4.5"/>
    <circle cx="120" cy="160" r="4.5"/>
    <circle cx="150" cy="105" r="4.5"/>
    <circle cx="150" cy="145" r="4.5"/>
  </g>

  <!-- wordmark -->
  <text x="215" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64"
        font-weight="700" letter-spacing="1">
    <tspan fill="#f87171">Sec</tspan><tspan fill="#e6edf3">GPT</tspan>
  </text>

  <!-- tagline -->
  <text x="217" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17"
        fill="#8b949e" letter-spacing="4">CYBERSECURITY LLM — FROM SCRATCH TO PRODUCTION</text>

  <!-- accent bar -->
  <rect x="218" y="190" width="430" height="3" rx="1.5" fill="url(#accentBar)"/>

  <!-- easter egg: hexspeak shown in its own actual color -->
  <text x="844" y="244" text-anchor="end" font-family="Consolas, 'Courier New', monospace"
        font-size="13" fill="#C0FFEE" opacity="0.8">[0xC0FFEE]</text>
</svg>
