<svg width="880" height="280" viewBox="0 0 880 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f5f"/>
      <stop offset="1" stop-color="#c81e1e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#00ff41"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="880" height="280" fill="#0d1117"/>

  <!-- circuit traces: left -->
  <g stroke="#00ff41" stroke-width="2" opacity="0.55">
    <line x1="18" y1="96" x2="72" y2="96"/>
    <line x1="18" y1="140" x2="70" y2="140"/>
    <line x1="18" y1="184" x2="72" y2="184"/>
    <circle cx="14" cy="96" r="4" fill="#00ff41" stroke="none"/>
    <circle cx="14" cy="140" r="4" fill="#00ff41" stroke="none"/>
    <circle cx="14" cy="184" r="4" fill="#00ff41" stroke="none"/>
  </g>

  <!-- circuit traces: right -->
  <g stroke="#00ff41" stroke-width="2" opacity="0.55">
    <line x1="208" y1="96" x2="238" y2="96"/>
    <line x1="210" y1="184" x2="238" y2="184"/>
    <circle cx="242" cy="96" r="4" fill="#00ff41" stroke="none"/>
    <circle cx="242" cy="184" r="4" fill="#00ff41" stroke="none"/>
  </g>

  <!-- shield -->
  <path d="M140,42 L206,66 V138 C206,190 178,226 140,248 C102,226 74,190 74,138 V66 Z"
        fill="#161b22" stroke="url(#shield)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M140,58 L192,77 V136 C192,181 169,212 140,231 C111,212 88,181 88,136 V77 Z"
        fill="none" stroke="#ff3b3b" stroke-width="1.5" opacity="0.5" stroke-linejoin="round"/>

  <!-- terminal glyph -->
  <text x="140" y="158" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
        font-size="56" font-weight="bold" fill="#00ff41">&gt;_</text>

  <!-- wordmark -->
  <text x="266" y="152" font-family="Consolas, 'Courier New', monospace" font-size="76"
        font-weight="bold" letter-spacing="2">
    <tspan fill="#ff3b3b">Sec</tspan><tspan fill="#e6edf3">GPT</tspan>
  </text>

  <!-- tagline -->
  <text x="270" y="196" font-family="Consolas, 'Courier New', monospace" font-size="21"
        fill="#00ff41" letter-spacing="1">CYBERSECURITY LLM // SCRATCH → PRODUCTION</text>

  <!-- accent bar -->
  <rect x="270" y="214" width="420" height="3" fill="url(#bar)"/>

  <!-- corner coordinates deco -->
  <text x="856" y="262" text-anchor="end" font-family="Consolas, 'Courier New', monospace"
        font-size="13" fill="#484f58">[0xC0FFEE]</text>
</svg>
